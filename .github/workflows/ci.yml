name: ci

# 纯前端示例插件（无 Go 后端）：推送到 main / PR 时检出宿主 SForum 源码，
# 用宿主 CLI 构建前端制品、刷新精确摘要、校验清单与宿主契约，
# 最后确认提交的制品与本次构建结果一致。
# 仓库根就是「外部扩展源根」，扩展包位于 plugins/sforum-demo-plugin。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SFORUM_REPOSITORY: keeptrue/SForum
  # 宿主的 extension build / validate / test 行为随 main 演进；需要锁定时把
  # 下面的 SFORUM_REF 改成 tag 或 commit。
  SFORUM_REF: main
  PACKAGE_DIR: plugins/sforum-demo-plugin

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout SForum framework
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SFORUM_REPOSITORY }}
          ref: ${{ env.SFORUM_REF }}
          path: sforum

      # 本包没有 Go 代码，但宿主 CLI 是 Go 程序，需要按宿主 go.mod 装工具链。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sforum/apps/api/go.mod
          cache-dependency-path: sforum/apps/api/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # 带后端的包必须先有 backend/plugin：extension build 里的 digest/validate/test
      # 会在清单声明 backend 时要求该二进制存在。纯前端包整步跳过。
      - name: Build backend binary when the manifest declares one
        working-directory: plugin
        run: |
          set -euo pipefail
          HAS_BACKEND="$(python3 -c "import json;print('true' if json.load(open('$PACKAGE_DIR/sforum.extension.json')).get('backend') else 'false')")"
          if [ "$HAS_BACKEND" != "true" ]; then
            echo "manifest declares no backend in $PACKAGE_DIR/sforum.extension.json; skipping backend build"
            exit 0
          fi
          (cd "$PACKAGE_DIR/backend" && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR/backend/plugin" ./)

      - name: Build frontend and refresh exact digests
        working-directory: sforum/apps/api
        run: go run ./cmd/sforum extension build "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR"

      - name: Brand asset check
        working-directory: sforum/apps/api
        run: go run ./cmd/sforum extension brand check "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR"

      - name: Manifest validation
        working-directory: sforum/apps/api
        run: go run ./cmd/sforum extension validate "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR"

      - name: Host contract checks
        working-directory: sforum/apps/api
        run: go run ./cmd/sforum extension test "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR"

      # 两段式：frontend/ 下的前端制品是确定性的，直接 git diff；清单里的 backend 摘要
      # 会随工具链/平台变化（digest --write 会改写 backend.digest），交给 python 脚本
      # 归一化后再比较整份清单，既能拦「改了 Vue 源码没重提交 dist」，也能拦
      # 「只改了清单没提交」。
      - name: Fail on committed artifact drift
        working-directory: plugin
        run: |
          set -euo pipefail
          if ! git diff --quiet -- "$PACKAGE_DIR/frontend"; then
            echo "::error title=制品漂移::前端制品或清单摘要与本次构建结果不一致；请本地执行 scripts/prepare-package.sh 后提交 frontend/ 与 sforum.extension.json。"
            git --no-pager diff -- "$PACKAGE_DIR/frontend"
            exit 1
          fi
          python3 scripts/check-manifest-drift.py "$PACKAGE_DIR"

      - name: Package smoke test
        working-directory: sforum/apps/api
        run: go run ./cmd/sforum extension package "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR" --exclude-source -o /tmp/plugin.zip
