name: release

# 推 v* 标签即发布：校验标签与清单版本一致 → 构建前端制品并打 SForum 包 → 挂到 Release。
# 本包是纯前端通用包，没有 Go 后端，也没有平台矩阵：同一个 zip 适用于所有平台。
# 仓库根是「外部扩展源根」，扩展包位于 plugins/sforum-demo-plugin。
# workflow_dispatch 只做校验与打包（不创建 Release），用于预演发布。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sforum_ref:
        description: 构建所使用的 SForum 引用（tag / 分支 / commit）
        required: false
        default: main

permissions:
  contents: write

env:
  SFORUM_REPOSITORY: keeptrue/SForum
  SFORUM_REF: ${{ github.event.inputs.sforum_ref || 'main' }}
  PACKAGE_DIR: plugins/sforum-demo-plugin
  PACKAGE_SLUG: sforum-demo-plugin

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SFORUM_REPOSITORY }}
          ref: ${{ env.SFORUM_REF }}
          path: sforum

      - uses: actions/setup-go@v5
        with:
          go-version-file: sforum/apps/api/go.mod
          cache-dependency-path: sforum/apps/api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python3 -c "import json;print(json.load(open('plugin/$PACKAGE_DIR/sforum.extension.json'))['version'])")"
          echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error title=版本不一致::标签 v$TAG_VERSION 与 sforum.extension.json 的 version ($MANIFEST_VERSION) 不一致。"
            exit 1
          fi

      - name: Build frontend, refresh digests and run host gates
        working-directory: sforum/apps/api
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR"
          go run ./cmd/sforum extension build "$PKG"
          go run ./cmd/sforum extension brand check "$PKG"
          go run ./cmd/sforum extension validate "$PKG"
          go run ./cmd/sforum extension test "$PKG"

      # extension build 会重写 frontend/admin/dist/* 与清单里的 digest；与 CI 一样，
      # 提交的制品必须等于当前源码的构建结果，否则打出来的包不是这个标签该有的内容。
      - name: Fail on committed artifact drift
        working-directory: plugin
        run: |
          set -euo pipefail
          if ! git diff --quiet -- "$PACKAGE_DIR"; then
            echo "::error title=构建产物漂移::extension build 改写了已提交的制品或摘要；请本地执行 scripts/prepare-package.sh 后提交这些文件。"
            git --no-pager diff -- "$PACKAGE_DIR"
            exit 1
          fi

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SFORUM_REPOSITORY }}
          ref: ${{ env.SFORUM_REF }}
          path: sforum

      - uses: actions/setup-go@v5
        with:
          go-version-file: sforum/apps/api/go.mod
          cache-dependency-path: sforum/apps/api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # 打包前重新构建一次，确保 zip 里的制品与清单摘要来自同一次构建。
      - name: Build frontend and refresh exact digests
        working-directory: sforum/apps/api
        run: go run ./cmd/sforum extension build "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR"

      - name: Package release zip
        id: package
        working-directory: plugin
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json;print(json.load(open('$PACKAGE_DIR/sforum.extension.json'))['version'])")"
          ASSET="${PACKAGE_SLUG}_${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # 本步骤的 cwd 是 plugin/，宿主检出在 $GITHUB_WORKSPACE/sforum，必须用绝对路径进宿主 CLI 目录。
          (cd "$GITHUB_WORKSPACE/sforum/apps/api" && go run ./cmd/sforum extension package "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR" --exclude-source -o "$GITHUB_WORKSPACE/plugin/dist/$ASSET.zip")
          # extension package 会把 SBOM 写在 zip 旁边：dist/<asset>.zip.sbom.json
          # 校验和写裸文件名（在 dist/ 内计算），这样 publish 把产物下载到 dist/ 后
          # `cd dist && sha256sum -c SHA256SUMS` 才能直接命中，而不是去找 dist/dist/<name>。
          (cd dist && sha256sum "$ASSET.zip" "$ASSET.zip.sbom.json" > SHA256SUMS)
          cat "dist/SHA256SUMS"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          # uses: 步骤不支持 working-directory，路径相对 $GITHUB_WORKSPACE 解析，
          # 而 zip 是上一个步骤在 plugin/ 下生成的。
          path: |
            plugin/dist/*.zip
            plugin/dist/*.zip.sbom.json
            plugin/dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          {
            echo '## 安装'
            echo
            echo '1. 下载 `'"$PACKAGE_SLUG"'_'"$VERSION"'.zip`。这是纯前端通用包，没有平台区分，任何平台共用同一个 zip。'
            echo '2. 装到 SForum：后台「插件管理 → 安装插件」上传 zip；或把 zip 解压到某个外部扩展源根的 `plugins/'"$PACKAGE_SLUG"'/`（即本仓库的目录布局），重启 API 让宿主扫描。'
            echo '3. 后台启用 **SForum Demo Plugin**，按宿主提示完成一次 exact-artifact `super_admin` 信任确认 —— 未确认前宿主不会导入包内的前端制品。'
            echo '4. 需要「管理」能力的角色，到「角色权限」授予 `sforum.demo-plugin.manage`。'
            echo '5. 启用后在后台侧栏新增「示例」分组，包含「示例面板」与「示例设置」两个菜单页。'
            echo
            echo '压缩包内的清单摘要与 `frontend/admin/dist/` 制品一一对应；校验：`sha256sum -c SHA256SUMS`。'
            echo
            echo '## 兼容性'
            echo
            echo '使用 Manifest V3（`sforum.manifest@3`），需要 SForum `>=3.1.0`。'
            echo '本包不含 Go 后端，运行时只加载 `frontend/admin/dist/dashboard.mjs` 与 `frontend/admin/dist/dashboard.css`。'
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md dist/*
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
